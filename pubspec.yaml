name: golfer_app
description: "Golfer - Interactive Multi-Player Golf Flight Manager, Automated Digital Scorecard, GPS Rangefinder, and AI Caddie."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get_it: ^8.0.3
  shared_preferences: ^2.3.4
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  fl_chart: ^0.70.2
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4+4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
